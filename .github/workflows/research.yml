name: Research

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run (recall.mjs or research.mjs)'
        default: 'recall.mjs'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backtest
        run: node ${{ inputs.script || 'recall.mjs' }}
      - name: Save results
        run: |
          git config user.name "base-watch-bot"
          git config user.email "base-watch-bot@users.noreply.github.com"
          git add -- '*.json'
          git commit -m "Research $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
