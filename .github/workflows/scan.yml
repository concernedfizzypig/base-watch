name: Scan

on:
  schedule:
    - cron: '0 15 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scan.mjs
      - name: Save results
        run: |
          git config user.name "base-watch-bot"
          git config user.email "base-watch-bot@users.noreply.github.com"
          git add results.json alerted.json
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
